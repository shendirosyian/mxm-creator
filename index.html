    <script>
      (function() {
        // Suppress harmless Vite HMR WebSocket connection errors in sandbox iframe environment
        function isViteWsError(err, file) {
          var msg = String(err && (err.message || err.stack) ? (err.message || err.stack) : err || '');
          var f = String(file || (err && err.filename) || '');
          return f.indexOf('@vite/client') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1;
        }

        window.addEventListener('error', function(e) {
          if (isViteWsError(e ? (e.error || e.message) : null, e ? e.filename : null)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e ? (e.reason || (e.detail && e.detail.reason)) : null;
          if (isViteWsError(reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
