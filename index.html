    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in sandbox iframe
      window.addEventListener('error', function(e) {
        if (e && (e.filename?.includes('@vite/client') || (typeof e.message === 'string' && e.message.includes('WebSocket')))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
